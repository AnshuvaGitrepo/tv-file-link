<svg viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="TV File Link banner">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="55%" stop-color="#111a2e"/>
      <stop offset="100%" stop-color="#18233d"/>
    </linearGradient>
    <radialGradient id="glowA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d4a72c" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#d4a72c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur1"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="blur2"><feGaussianBlur stdDeviation="55"/></filter>
  </defs>
  <rect width="1200" height="400" fill="url(#bg)"/>
  <circle cx="200" cy="70" r="220" fill="url(#glowA)" filter="url(#blur1)"/>
  <circle cx="1040" cy="330" r="260" fill="url(#glowB)" filter="url(#blur2)"/>

  <rect x="80" y="104" width="56" height="5" rx="2.5" fill="#d4a72c"/>
  <text x="80" y="180" font-family="Segoe UI, Arial, sans-serif" font-size="68" font-weight="700" fill="#f3f4f8">TV File Link</text>
  <text x="80" y="222" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#b6bdd0">File manager for Fire TV, with Wi-Fi transfers from any browser</text>

  <g transform="translate(80,268)" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#8e97ae">
    <circle cx="6" cy="-6" r="4" fill="#d4a72c"/><text x="20" y="0">Fire OS 6+</text>
    <circle cx="136" cy="-6" r="4" fill="#d4a72c"/><text x="150" y="0">Six-digit code</text>
    <circle cx="290" cy="-6" r="4" fill="#d4a72c"/><text x="304" y="0">No cloud, no phone app</text>
    <circle cx="530" cy="-6" r="4" fill="#d4a72c"/><text x="544" y="0">MIT licensed</text>
  </g>

  <!-- logo, enlarged -->
  <g transform="translate(860,70) scale(2.1)">
    <linearGradient id="tfl-frame" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2b3a5e"/><stop offset="1" stop-color="#141c30"/></linearGradient>
    <linearGradient id="tfl-gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f2cd5c"/><stop offset="1" stop-color="#c8961e"/></linearGradient>
    <linearGradient id="tfl-badge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
    <rect x="8" y="16" width="112" height="76" rx="12" fill="url(#tfl-frame)" stroke="#ffffff" stroke-opacity=".08"/>
    <rect x="15" y="23" width="98" height="62" rx="7" fill="#0b1120"/>
    <rect x="15" y="23" width="98" height="62" rx="7" fill="none" stroke="#ffffff" stroke-opacity=".12" stroke-width="1.5"/>
    <path d="M48 100 H80 L86 110 H42 Z" fill="#2b3a5e"/>
    <rect x="36" y="108" width="56" height="6" rx="3" fill="#3a4b74"/>
    <path d="M34 40 H54 L60 46 H90 A4 4 0 0 1 94 50 V72 A4 4 0 0 1 90 76 H38 A4 4 0 0 1 34 72 Z" fill="url(#tfl-gold)"/>
    <path d="M34 52 H94" stroke="#0b1120" stroke-opacity=".25" stroke-width="2"/>
    <g stroke="#1a2440" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M56 70 V58 M51 63 L56 58 L61 63"/>
      <path d="M72 58 V70 M67 65 L72 70 L77 65"/>
    </g>
    <circle cx="104" cy="22" r="18" fill="url(#tfl-badge)" stroke="#ffffff" stroke-width="3.5"/>
    <g fill="none" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round">
      <path d="M93 20 A15 15 0 0 1 115 20"/>
      <path d="M97.5 24.5 A9 9 0 0 1 110.5 24.5"/>
    </g>
    <circle cx="104" cy="29" r="2.6" fill="#ffffff"/>
  </g>
</svg>
