<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="TV File Link">
  <defs>
    <linearGradient id="tfl-frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b3a5e"/>
      <stop offset="1" stop-color="#141c30"/>
    </linearGradient>
    <linearGradient id="tfl-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2cd5c"/>
      <stop offset="1" stop-color="#c8961e"/>
    </linearGradient>
    <linearGradient id="tfl-badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
  </defs>
  <!-- TV -->
  <rect x="8" y="16" width="112" height="76" rx="12" fill="url(#tfl-frame)"/>
  <rect x="15" y="23" width="98" height="62" rx="7" fill="#0b1120"/>
  <rect x="15" y="23" width="98" height="62" rx="7" fill="none" stroke="#ffffff" stroke-opacity=".12" stroke-width="1.5"/>
  <path d="M48 100 H80 L86 110 H42 Z" fill="#2b3a5e"/>
  <rect x="36" y="108" width="56" height="6" rx="3" fill="#3a4b74"/>
  <!-- folder on screen -->
  <path d="M34 40 H54 L60 46 H90 A4 4 0 0 1 94 50 V72 A4 4 0 0 1 90 76 H38 A4 4 0 0 1 34 72 Z" fill="url(#tfl-gold)"/>
  <path d="M34 52 H94" stroke="#0b1120" stroke-opacity=".25" stroke-width="2"/>
  <!-- two-way transfer arrows on the folder -->
  <g stroke="#1a2440" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M56 70 V58 M51 63 L56 58 L61 63"/>
    <path d="M72 58 V70 M67 65 L72 70 L77 65"/>
  </g>
  <!-- Wi-Fi badge -->
  <circle cx="104" cy="22" r="18" fill="url(#tfl-badge)" stroke="#ffffff" stroke-width="3.5"/>
  <g fill="none" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round">
    <path d="M93 20 A15 15 0 0 1 115 20"/>
    <path d="M97.5 24.5 A9 9 0 0 1 110.5 24.5"/>
  </g>
  <circle cx="104" cy="29" r="2.6" fill="#ffffff"/>
</svg>
